# Place everything in the llm namespace onto every member labelled gpu=true.
apiVersion: placement.kubernetes-fleet.io/v1beta1
kind: ClusterResourcePlacement
metadata:
  name: chat
spec:
  resourceSelectors:
    - group: ""
      version: v1
      kind: Namespace
      name: llm
  policy:
    placementType: PickAll
    affinity:
      clusterAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          clusterSelectorTerms:
            - labelSelector:
                matchLabels:
                  gpu: "true"
  strategy:
    type: RollingUpdate
